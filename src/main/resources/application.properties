#Mongo
quarkus.mongodb.connection-string=${DB_URL:mongodb://localhost:27017}
quarkus.mongodb.credentials.username=${DB_USER}
quarkus.mongodb.credentials.password=${DB_PASSWORD}
quarkus.mongodb.database=${DB_NAME}
quarkus.mongodb.credentials.auth-source=admin

#Logs
quarkus.log.category."org.mongodb.driver".level=WARN

#Internal services
biological-objects-api/mp-rest/url=http://search-biological-objects:8080
config-and-control-api/mp-rest/url=http://config-and-control:8080

#NCBI ESearch
quarkus.rest-client.ncbi-esearch-api.url=https://eutils.ncbi.nlm.nih.gov/entrez/eutils
ncbi.esearch.tool=pubmed-integration
ncbi.esearch.email=${NCBI_EMAIL}
ncbi.esearch.api-key=${NCBI_API_KEY}
ncbi.rate-limit.with-key=${NCBI_RATE_LIMIT_WITH_KEY:8.0}
ncbi.rate-limit.without-key=${NCBI_RATE_LIMIT_WITHOUT_KEY:2.0}

# RabbitMQ connection
rabbitmq-host=${RABBIT_HOST:localhost}
rabbitmq-port=${RABBIT_PORT:5672}
rabbitmq-username=${RABBIT_USER}
rabbitmq-password=${RABBIT_PASSWORD}

# Producer channel configuration
mp.messaging.outgoing.ncbi-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.ncbi-out.exchange.name=exchange-ncbi-pubmed
mp.messaging.outgoing.ncbi-out.host=${rabbitmq-host}
mp.messaging.outgoing.ncbi-out.port=${rabbitmq-port}
mp.messaging.outgoing.ncbi-out.username=${rabbitmq-username}
mp.messaging.outgoing.ncbi-out.password=${rabbitmq-password}
mp.messaging.outgoing.ncbi-out.routing.key=ncbi-pubmed-queue

# Consumer channel configuration
mp.messaging.incoming.ncbi-in.connector=smallrye-rabbitmq
mp.messaging.incoming.ncbi-in.queue.name=ncbi-pubmed-queue
mp.messaging.incoming.ncbi-in.host=${rabbitmq-host}
mp.messaging.incoming.ncbi-in.port=${rabbitmq-port}
mp.messaging.incoming.ncbi-in.username=${rabbitmq-username}
mp.messaging.incoming.ncbi-in.password=${rabbitmq-password}
mp.messaging.incoming.ncbi-in.exchange.name=exchange-ncbi-pubmed
mp.messaging.incoming.ncbi-in.max-outstanding-messages=1

# Set lazy queue mode
mp.messaging.incoming.ncbi-in.queue.x-queue-mode=lazy

# PubTator3 API
quarkus.rest-client.pubtator-api.url=https://www.ncbi.nlm.nih.gov/research/pubtator3-api
pubtator.batch-size=${PUBTATOR_BATCH_SIZE:50}
pubtator.rate-limit=${PUBTATOR_RATE_LIMIT:3.0}

# PubTator Producer channel
mp.messaging.outgoing.pubtator-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.pubtator-out.exchange.name=exchange-pubtator
mp.messaging.outgoing.pubtator-out.host=${rabbitmq-host}
mp.messaging.outgoing.pubtator-out.port=${rabbitmq-port}
mp.messaging.outgoing.pubtator-out.username=${rabbitmq-username}
mp.messaging.outgoing.pubtator-out.password=${rabbitmq-password}
mp.messaging.outgoing.pubtator-out.routing.key=pubtator-queue

# PubTator Consumer channel
mp.messaging.incoming.pubtator-in.connector=smallrye-rabbitmq
mp.messaging.incoming.pubtator-in.queue.name=pubtator-queue
mp.messaging.incoming.pubtator-in.host=${rabbitmq-host}
mp.messaging.incoming.pubtator-in.port=${rabbitmq-port}
mp.messaging.incoming.pubtator-in.username=${rabbitmq-username}
mp.messaging.incoming.pubtator-in.password=${rabbitmq-password}
mp.messaging.incoming.pubtator-in.exchange.name=exchange-pubtator
mp.messaging.incoming.pubtator-in.max-outstanding-messages=5
mp.messaging.incoming.pubtator-in.queue.x-queue-mode=lazy